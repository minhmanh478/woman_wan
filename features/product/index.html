<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - WOMAN WAN</title>
  <meta name="description" content="Chi tiết sản phẩm thời trang thể thao phong cách Clean Fit cao cấp của WOMAN WAN.">
  <link rel="stylesheet" href="../style.css?v=ww_pdp_4thumbs">
  <link rel="stylesheet" href="product.css?v=ww_pdp_4thumbs">
  <link rel="stylesheet" href="../css/components/page-transition.css?v=ww_pdp_4thumbs">
  <script src="../components/footer-widget.js?v=ww_pdp_4thumbs" defer></script>
  <script src="../components/header-widget.js?v=ww_pdp_4thumbs" defer></script>
  <script src="../components/page-transition-widget.js?v=ww_pdp_4thumbs" defer></script>
</head>

<body>
  <!-- REUSABLE HEADER & MEGA NAV WIDGET (DATA-DRIVEN FROM navigation.json) -->
  <womanwan-header></womanwan-header>

  <!-- PAGE TRANSITION WIDGET -->
  <womanwan-page-transition></womanwan-page-transition>

  <!-- PRODUCT DETAIL PAGE CONTAINER -->
  <main class="pdp-page-container">
    <div class="pdp-wrapper">

      <!-- LEFT COLUMN: BREADCRUMB & 2x2 GALLERY -->
      <div class="pdp-left">
        <nav class="pdp-breadcrumb" id="pdpBreadcrumb" aria-label="Đường dẫn"></nav>

        <!-- Product Gallery Container -->
        <div class="pdp-gallery-container">
          <!-- Desktop 1+2x2 Lookbook Grid (hidden on mobile <= 920px) -->
          <div class="pdp-gallery-grid" id="pdpGalleryGrid">
            <!-- Dynamically populated from product.json -->
          </div>

          <!-- Mobile Product Gallery: 1 Main Featured Image + Thumbnail Slider Below (<= 920px) -->
          <div class="pdp-mobile-gallery" id="pdpMobileGallery">
            <div class="pdp-mobile-main-wrap" id="pdpMobileMainWrap">
              <img id="pdpMobileMainImg" src="" alt="Ảnh sản phẩm" onclick="handleMobileMainImgClick()">
            </div>
            <div class="pdp-mobile-thumbs-container">
              <button type="button" class="pdp-thumb-arrow-btn pdp-thumb-prev-btn" id="pdpThumbPrevBtn" onclick="handleMobileThumbNav('prev')" aria-label="Ảnh trước">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <div class="pdp-mobile-thumbs-strip" id="pdpMobileThumbsStrip">
                <!-- Dynamically populated from product.json -->
              </div>
              <button type="button" class="pdp-thumb-arrow-btn pdp-thumb-next-btn" id="pdpThumbNextBtn" onclick="handleMobileThumbNav('next')" aria-label="Ảnh tiếp theo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
          </div>

          <!-- "Xem thêm" Button (Desktop) -->
          <div class="pdp-expand-wrap">
            <button class="pdp-expand-btn" id="pdpExpandBtn" onclick="handleExpandGallery()">
              <span>Xem thêm</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- ACCORDION SECTION: ĐÁNH GIÁ, MÔ TẢ & THÔNG TIN CHI TIẾT -->
        <section class="pdp-details-accordion-container" id="pdpDetailsSection">
          <div class="pdp-details-accordion-list">


            <!-- Accordion Item 2: Mô tả sản phẩm -->
            <div class="pdp-details-item">
              <button class="pdp-details-header" onclick="toggleDetailsItem(this)">
                <span>Mô tả</span>
                <span class="pdp-details-header-right">
                  <svg class="pdp-details-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </span>
              </button>
              <div class="pdp-details-content">
                <div class="pdp-desc-grid">
                  <div class="pdp-desc-main">
                    <h3 id="pdpDescTitle">Áo thun tăng chiều cao Clean Fit - WOMAN WAN cổ tròn cotton Menswear</h3>
                    <p class="pdp-desc-lead" id="pdpDescLead"></p>
                    <div class="pdp-desc-body" id="pdpDescBody"></div>
                  </div>
                  <div class="pdp-desc-highlights">
                    <h4>Đặc điểm nổi bật</h4>
                    <ul id="pdpDescHighlightsList"></ul>
                  </div>
                </div>
              </div>
            </div>

            <!-- Accordion Item 3: Thông tin chi tiết -->
            <div class="pdp-details-item">
              <button class="pdp-details-header" onclick="toggleDetailsItem(this)">
                <span>Thông tin chi tiết</span>
                <span class="pdp-details-header-right">
                  <svg class="pdp-details-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </span>
              </button>
              <div class="pdp-details-content">
                <table class="pdp-specs-table">
                  <tbody id="pdpSpecsTableBody"></tbody>
                </table>
              </div>
            </div>

          </div>
        </section>

      </div>

      <!-- RIGHT COLUMN: STICKY BUY & DETAILS PANEL -->
      <div class="pdp-right">

        <!-- Category & Rating -->
        <div class="pdp-meta-row">
          <span class="pdp-category-text" id="pdpCategoryText">Nam • Originals</span>
          <a href="#pdpTabsSection" class="pdp-reviews-box" id="pdpRatingText">
            4.7 <span class="pdp-stars">★★★★★</span> <span class="pdp-reviews-count">(137)</span>
          </a>
        </div>

        <!-- Badges -->
        <div class="pdp-badges-row" id="pdpBadgesRow">
          <span class="pdp-badge-pill new-tag">MỚI</span>
        </div>

        <!-- Title -->
        <h1 class="pdp-title" id="pdpTitle">Áo thun tăng chiều cao Clean Fit - WOMAN WAN cổ tròn cotton Menswear</h1>

        <!-- Price -->
        <div class="pdp-price-row">
          <span class="pdp-price-current" id="pdpPriceCurrent">1.300.000₫</span>
          <span class="pdp-price-base" id="pdpPriceBase">1.650.000₫</span>
        </div>

        <!-- Colors Selection -->
        <div class="pdp-colors-section">
          <div class="pdp-section-header">
            <span>Màu sắc: <strong class="pdp-color-name-label" id="pdpSelectedColorName">Aurora Coffee</strong></span>
          </div>
          <div class="pdp-color-thumbnails" id="pdpColorThumbnails">
            <!-- Dynamically populated from product.json -->
          </div>
        </div>

        <!-- Sizes Selection -->
        <div class="pdp-sizes-section" id="pdpSizesSection">
          <div class="pdp-section-header">
            <span style="font-weight:700;">Kích cỡ<span class="pdp-size-status" id="pdpSizeStatus">: Chưa
                chọn</span></span>
          </div>

          <div class="pdp-sizes-grid" id="pdpSizesGrid">
            <!-- Dynamically populated from product.json -->
          </div>
        </div>

        <!-- Action Buttons Group (Add to Cart & Buy Now) -->
        <div class="pdp-cta-group">
          <div class="pdp-actions-row">
            <button class="pdp-add-cart-btn" id="pdpAddToCartBtn" onclick="handleAddToCartPDP()"
              aria-label="Thêm vào giỏ hàng">
              <span>THÊM VÀO GIỎ HÀNG</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M15.5999 8.3998V5.39981C15.5999 3.41158 13.9881 1.7998 11.9999 1.7998C10.0117 1.7998 8.3999 3.41158 8.3999 5.3998V8.3998M4.72717 22.1998H19.2726C20.5579 22.1998 21.5999 21.1772 21.5999 19.9158L20.109 7.79977C20.109 6.53835 19.067 5.51576 17.7817 5.51576H5.92717C4.64186 5.51576 3.5999 6.53835 3.5999 7.79977L2.3999 19.9158C2.3999 21.1772 3.44186 22.1998 4.72717 22.1998Z">
                </path>
              </svg>
            </button>
            <button class="pdp-wishlist-btn" id="pdpWishlistBtn" onclick="handleToggleWishlistPDP()"
              aria-label="Thêm vào yêu thích" title="Thêm vào yêu thích">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                </path>
              </svg>
            </button>
          </div>

          <!-- Secondary Button: Đặt hàng ngay (Express Checkout) -->
          <button type="button" class="pdp-buy-now-btn" id="pdpBuyNowBtn" onclick="handleBuyNowPDP()"
            aria-label="Đặt hàng ngay">
            <span>ĐẶT HÀNG NGAY</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

        <!-- Product Specifications & Size Guide Panel -->
        <div class="pdp-specifications-container">
          <div class="pdp-size-chart-box">
            <img src="../assets/size/image.png" alt="Bảng kích thước chuẩn WOMAN WAN" class="pdp-size-chart-img"
              loading="lazy">
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- LIGHTBOX MODAL FOR IMAGE ZOOM -->
  <div class="pdp-lightbox" id="pdpLightbox" onclick="closeLightbox()">
    <button class="pdp-lightbox-close" onclick="closeLightbox()" aria-label="Đóng">&times;</button>
    <img src="" alt="Ảnh sản phẩm phóng to" class="pdp-lightbox-img" id="pdpLightboxImg"
      onclick="event.stopPropagation()">
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="wan-toast" id="wanToast" role="alert" aria-live="polite"></div>

  <!-- FOOTER WIDGET -->
  <womanwan-footer></womanwan-footer>

  <!-- 3 Nút Liên hệ Nổi (Góc trái màn hình) -->
  <div class="ww-floating-contact" id="womanwanFloatingContact" role="region" aria-label="Liên hệ nhanh WOMAN WAN">
    <a href="tel:0867774069" class="ww-float-btn phone-btn" aria-label="Gọi hotline 0867 774 069">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.15 6.59l2.2-2.2c.28-.28.67-.36 1.02-.25 1.12.37 2.32.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        <path d="M16.5 3.5a7 7 0 0 1 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M14.5 6.5a3.5 3.5 0 0 1 2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
    <a href="https://zalo.me/0867774069" target="_blank" rel="noopener noreferrer" class="ww-float-btn zalo-btn" aria-label="Chat Zalo">
      <svg width="26" height="26" viewBox="0 0 36 36" fill="none">
        <path d="M18 5.5C10.8 5.5 5 10.4 5 16.5c0 3.5 1.9 6.6 4.9 8.6-.2 2-1 3.9-2.2 5.1 2.6-.2 5.3-1.2 7.2-2.4 1 .2 2 .3 3.1.3 7.2 0 13-4.9 13-11S25.2 5.5 18 5.5z" fill="#ffffff"/>
        <text x="18" y="20.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="10.5" fill="#000000" text-anchor="middle" letter-spacing="-0.3px">Zalo</text>
      </svg>
    </a>
    <a href="https://m.me/womanwan.vn" target="_blank" rel="noopener noreferrer" class="ww-float-btn messenger-btn" aria-label="Chat Messenger">
      <svg width="23" height="23" viewBox="0 0 28 28" fill="none">
        <path d="M14 2C7.37 2 2 7.05 2 13.28c0 3.54 1.73 6.7 4.45 8.78.23.18.37.45.38.74l.08 2.3c.03.88.94 1.45 1.71 1.05l2.58-1.34c.24-.12.51-.15.77-.08 1.3.36 2.68.55 4.03.55 6.63 0 12-5.05 12-11.28C26 7.05 20.63 2 14 2z" fill="#ffffff"/>
        <path d="M6.8 16.5l4.5-7.15c.6-.95 1.95-1.15 2.8-.42l3.55 3.05c.27.23.66.23.93 0l3.82-2.9c.56-.42 1.3.26.9 0.82l-4.5 7.15c-.6.95-1.95 1.15-2.8.42l-3.55-3.05c-.27-.23-.66-.23-.93 0l-3.82 2.9c-.56.42-1.3-.26-.9-.82z" fill="#000000"/>
      </svg>
    </a>
  </div>

  <script src="product.js?v=ww_pdp_4thumbs"></script>
</body>

</html>
